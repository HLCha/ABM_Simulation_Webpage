<style>
:root{--pref:#c25b54;--pref-d:#8e3b36;--short:#4a4a4a;--green:#7a9a5b;

*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
#map{position:absolute;inset:0}

  overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 2px 12px rgba(0,0,0,.14);z-index:1000}
.panel h1{margin:0;padding:14px 16px 12px;font-size:14px;font-weight:600;color:var(--pref-d);border-bottom:1px solid var(--line)}
.sec{padding:12px 15px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#9a9a9a;margin-bottom:7px}
.row{display:flex;justify-content:space-between;padding:2px 0}
.row span:last-child{font-variant-numeric:tabular-nums}

select{width:100%}
button{cursor:pointer}

.modes{display:flex;gap:6px;margin-bottom:2px}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.verdict{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:600;font-size:12px;color:#fff}

.pv{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}

.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.d{color:var(--pref);font-weight:600}
.dn{color:var(--hot);font-weight:600}
.hint{color:#9a9a9a;font-size:12px}

.foot{padding:11px 15px;font-size:11px;color:#9a9a9a}

.wt.on{display:block}

.gauge{text-align:center}
.gauge .cap{font-size:11px;color:#666;margin-bottom:5px;font-weight:500}
.gauge .val{font-size:12px;font-variant-numeric:tabular-nums;margin-top:5px}
.gwrap{position:relative;width:82px;height:82px;margin:0 auto;border-radius:50%;

.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;

function ramp(cs,t){t=Math.max(0,Math.min(1,t));const n=cs.length-1,i=Math.min(Math.floor(t*n),n-1),f=t*n-i;
  const a=cs[i],b=cs[i+1];return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(',')})`}
const LAYERS = {
  pet:{ramp:'heat',label:'\uccb4\uac10\ub354\uc704'}, utci:{ramp:'heat',label:'UTCI'},

/* ---------- graph ---------- */
const E = D.edges, T = E.topology, N = D.nodes.length;
const adj = Array.from({length:N},()=>[]);
T.forEach((e,i)=>{adj[e.u].push([e.v,i]);adj[e.v].push([e.u,i])});
const etaRef = Math.max(...E.pref.filter(v=>v!=null));
const etaMed = (()=>{const a=E.pref.filter(v=>v!=null).slice().sort((x,y)=>x-y);return a[a.length>>1]})();
const costLen = i => E.len[i];
const costPref = i => {const p = E.pref[i]==null?etaMed:E.pref[i];
  return E.len[i]*(1+D.lam*Math.max(0,etaRef-p))};
function extent(k){const v=E[k].filter(x=>x!=null);return [Math.min(...v),Math.max(...v)]}
const EXT = {pet:extent('pet'),utci:extent('utci'),svf:extent('svf'),gvi:extent('gvi'),slope:extent('slope'),pref:extent('pref')};

function dijkstra(s,t,cost){
  const dist=new Float64Array(N).fill(Infinity),prev=new Int32Array(N).fill(-1),pe=new Int32Array(N).fill(-1);
  dist[s]=0;const h=[[0,s]];
  const push=(d,n)=>{h.push([d,n]);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;[h[p],h[i]]=[h[i],h[p]];i=p}};
  const pop=()=>{const top=h[0],last=h.pop();if(h.length){h[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;
    if(l<h.length&&h[l][0]<h[m][0])m=l;if(r<h.length&&h[r][0]<h[m][0])m=r;if(m===i)break;[h[m],h[i]]=[h[i],h[m]];i=m}}return top};
  const seen=new Uint8Array(N);
  while(h.length){const [d,n]=pop();if(seen[n])continue;seen[n]=1;if(n===t)break;
    for(const [m,ei] of adj[n]){const nd=d+cost(ei);if(nd<dist[m]){dist[m]=nd;prev[m]=n;pe[m]=ei;push(nd,m)}}}
  if(dist[t]===Infinity)return null;
  const out=[];for(let n=t;n!==s;n=prev[n])out.push(pe[n]);return out.reverse();
}
function summarise(ids){
  const L=ids.reduce((a,i)=>a+E.len[i],0);
  const w=k=>ids.reduce((a,i)=>a+E.len[i]*(E[k][i]??0),0)/L;
  return {len:L,pet:w('pet'),utci:w('utci'),pref:w('pref'),svf:w('svf'),gvi:w('gvi'),slope:w('slope')};
}

  const [lo,hi]=EXT[layerKey]||extent(layerKey),v=E[layerKey];
  lines.forEach((l,i)=>{const t=v[i]==null?0:(v[i]-lo)/(hi-lo||1);
    l.setStyle({color:ramp(RAMPS[cfg.ramp],cfg.rev?1-t:t),weight:2.7})});
  const stops=[];for(let i=0;i<=10;i++){const t=i/10;stops.push(ramp(RAMPS[cfg.ramp],cfg.rev?1-t:t))}
  document.getElementById('bar').style.background=`linear-gradient(90deg,${stops.join(',')})`;
  const f=x=>Math.abs(x)<1?x.toFixed(3):x.toFixed(1);
  document.getElementById('lo').textContent=f(lo);
  document.getElementById('hi').textContent=f(hi)+'   '+cfg.label;
}
document.querySelectorAll('#layerChips button').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#layerChips button').forEach(b=>b.className='');
    btn.className='on';
    layerKey=btn.dataset.k;
    document.getElementById('bar').style.display=(layerKey==='none')?'none':'block';
    paint();
  };
});

/* ---------- interaction ---------- */
let mode='inspect', pick=[];
const nodeLL = D.nodes;
function nearestNode(ll){let bi=0,bd=Infinity;
  for(let i=0;i<N;i++){const dy=nodeLL[i][0]-ll.lat,dx=(nodeLL[i][1]-ll.lng)*0.79;const d=dy*dy+dx*dx;
    if(d<bd){bd=d;bi=i}}return bi}
function nearestEdge(ll){let bi=0,bd=Infinity;
  T.forEach((e,i)=>{for(const c of e.c){const dy=c[0]-ll.lat,dx=(c[1]-ll.lng)*0.79;const d=dy*dy+dx*dx;
    if(d<bd){bd=d;bi=i}}});return bi}

const body=document.getElementById('body');
function resetAll(){pick=[];routeLayer.clearLayers();markLayer.clearLayers();stopWalk();
  document.getElementById('wt').classList.remove('on')}
function setMode(m){mode=m;resetAll();map.closePopup();
  document.getElementById('mInspect').className=m==='inspect'?'on':'';
  document.getElementById('mRoute').className=m==='route'?'on':'';
  if(m==='inspect')document.getElementById('wt').classList.remove('on');
  document.getElementById('foot').style.display=(m==='inspect')?'block':'none';
  body.innerHTML=m==='inspect'
    ? '<div class="hint">지도를 클릭하면 그 지점의 환경값을 보여줍니다.</div>'
    : '<div class="hint">출발지를 클릭한 뒤 도착지를 클릭하세요.</div>';
}
document.getElementById('mInspect').onclick=()=>setMode('inspect');
document.getElementById('mRoute').onclick=()=>setMode('route');

// Walkability verdict from the preference index eta, split into terciles over
// the observed range. Higher eta = more preferred, so the top third is "good".
const PREF_EXT=EXT.pref;
function verdict(eta){
  if(eta==null)return {label:'정보 없음',color:'#b0b0b0',t:0.5};
  const [lo,hi]=PREF_EXT,t=(eta-lo)/((hi-lo)||1);
  if(t>=2/3)return {label:'선호도 상위',color:'#7a9a5b',t};
  if(t>=1/3)return {label:'선호도 중위',color:'#c99a4e',t};
  return {label:'선호도 하위',color:'#c25b54',t};
}
function popupHtml(i,vd){
  return `<div style="margin-bottom:6px"><span class="verdict" style="background:${vd.color}">${vd.label}</span></div>
  <div class="row pv"><span>체감더위 (PET)&nbsp;&nbsp;</span><span>${fmt(E.pet[i],1)} \u00b0C</span></div>
  <div class="row pv"><span>GVI (녹지)&nbsp;&nbsp;</span><span>${fmt(E.gvi[i],2)}</span></div>
  <div class="row pv"><span>SVF (하늘트임)&nbsp;&nbsp;</span><span>${fmt(E.svf[i],2)}</span></div>`;
}
const fmt=(x,d=2)=>x==null||isNaN(x)?'—':x.toFixed(d);
function rowsFor(i){
  return `<div class="row"><span>체감더위 (PET)</span><span>${fmt(E.pet[i],1)} &deg;C</span></div>
  <div class="row"><span>GVI (녹지)</span><span>${fmt(E.gvi[i],2)}</span></div>
  <div class="row"><span>SVF (하늘트임)</span><span>${fmt(E.svf[i],2)}</span></div>
  <div class="row"><span>경사</span><span>${fmt(E.slope[i],2)}</span></div>
  <div class="row"><span>구간 길이</span><span>${fmt(E.len[i],0)} m</span></div>
  <div class="hint" style="margin-top:6px">${E.obs[i]?'스트리트뷰 실측 구간':'인접 관측값으로 추정된 구간'}</div>`;
}

let curRoute=null;   // preference-aware edge ids, for the walkthrough
map.on('click',ev=>{
  if(mode==='inspect'){
    const i=nearestEdge(ev.latlng);routeLayer.clearLayers();
    const vd=verdict(E.pref[i]);
    L.polyline(T[i].c,{color:vd.color,weight:6,opacity:.95}).addTo(routeLayer);
    // midpoint of the segment for the popup anchor
    const cc=T[i].c[Math.floor(T[i].c.length/2)];
    L.popup({closeButton:true,autoPan:true})
      .setLatLng(cc)
      .setContent(popupHtml(i,vd))
      .openOn(map);
    body.innerHTML=`<div style="margin-bottom:8px"><span class="verdict" style="background:${vd.color}">${vd.label}</span></div>`+rowsFor(i);
    return;
  }
  // route mode: a fresh first click after a completed pair resets everything
  if(pick.length>=2)resetAll();
  // Snap to the pedestrian network: find the nearest edge, then take whichever of
  // its two endpoints is closer to the click. Snapping to a node directly was
  // imprecise because node coordinates are reconstructed from edge endpoints.
  const ei=nearestEdge(ev.latlng);
  const eu=T[ei].u, evv=T[ei].v;
  const du=Math.hypot(nodeLL[eu][0]-ev.latlng.lat,(nodeLL[eu][1]-ev.latlng.lng)*0.79);
  const dv=Math.hypot(nodeLL[evv][0]-ev.latlng.lat,(nodeLL[evv][1]-ev.latlng.lng)*0.79);
  const n=du<=dv?eu:evv;
  pick.push(n);
  markLayer.clearLayers();
  pick.forEach(pn=>L.circleMarker(nodeLL[pn],{radius:6,color:'#fff',weight:2.5,
    fillColor:'#4a4a4a',fillOpacity:1}).addTo(markLayer));
  if(pick.length===1){body.innerHTML='<div class="hint">도착지를 클릭하세요.</div>';
    document.getElementById('wt').classList.remove('on');return}
  const [s,t]=pick;
  const A=dijkstra(s,t,costLen), B=dijkstra(s,t,costPref);
  routeLayer.clearLayers();
  if(!A||!B){body.innerHTML='<div class="hint">두 지점 사이에 경로가 없습니다.</div>';return}
  // Shortest path: a solid dark-grey line underneath. Preference route: a single
  // strong pink-red on top, so the two read clearly without colouring by PET.
  A.forEach(i=>L.polyline(T[i].c,{color:'#4a4a4a',weight:4,opacity:.85}).addTo(routeLayer));
  B.forEach(i=>L.polyline(T[i].c,{color:'#c25b54',weight:5.5,opacity:1}).addTo(routeLayer));
  const a=summarise(A),b=summarise(B);
  // The detailed comparison lives in the walkthrough gauges below; here we keep a
  // single headline so the panel is not crowded.
  const dPet=(b.pet-a.pet), dLen=(b.len-a.len);
  body.innerHTML=`<div style="font-size:13px;line-height:1.6">
    쾌적경로는 <b>${dLen>=0?'+':''}${dLen.toFixed(0)} m</b> 더 걷는 대신
    체감더위를 <b style="color:var(--pref)">${dPet<=0?'':'+'}${dPet.toFixed(1)} \u00b0C</b> 낮춥니다.
    </div>`;
  curRoute=B;setupWalk(B,A);
});

/* ---------- walkthrough ---------- */
const GDEF=[
  {k:'pet',cap:'체감더위 (PET)',ramp:'heat',unit:'\u00b0C',up:true,dp:1},
  {k:'slope',cap:'경사',ramp:'mono',unit:'',up:true,dp:2},
  {k:'svf',cap:'SVF (하늘트임)',ramp:'cool',unit:'',up:false,dp:2},
  {k:'gvi',cap:'GVI (녹지)',ramp:'green',unit:'',up:false,dp:2}
];
// PET thermal-stress classes (Matzarakis & Mayer 1996). Boundaries in degC.
// Used only for the legend and the faint band behind the PET gauge; the model
// itself uses the continuous PET value.
const PET_CLASSES=[
  {max:18,label:'선선',      color:'#8db8d8'},
  {max:23,label:'쾌적',      color:'#bcd9b0'},
  {max:29,label:'약간 더움',  color:'#f2e2a0'},
  {max:35,label:'더움',      color:'#f0b878'},
  {max:41,label:'매우 더움',  color:'#e08858'},
  {max:99,label:'극심한 더위',color:'#d0574a'},
];
function petBands(){
  const [lo,hi]=EXT.pet,span=(hi-lo)||1;let prev=lo,html='';
  PET_CLASSES.forEach(c=>{
    const top=Math.min(c.max,hi);if(top<=prev){prev=Math.max(prev,c.max);return}
    const b0=(prev-lo)/span*100, b1=(top-lo)/span*100;
    html+=`<div class="gband" style="bottom:${b0}%;height:${b1-b0}%;background:${c.color};opacity:.5"></div>`;
    prev=top;
  });
  return html;
}
let walkTimer=null;
let WK={pref:null, short:null};   // each: {pts:[{lat,lng,ei,d}], len}
const dot=L.circleMarker([0,0],{radius:8,color:'#fff',weight:2.5,fillColor:'#c25b54',fillOpacity:1});
const dotS=L.circleMarker([0,0],{radius:6,color:'#fff',weight:2,fillColor:'#4a4a4a',fillOpacity:1});

function densify(ids){
  const pts=[];let len=0,prev=null;
  ids.forEach(ei=>{
    let c=T[ei].c;
    if(prev){
      const dS=Math.hypot(c[0][0]-prev[0],c[0][1]-prev[1]);
      const dE=Math.hypot(c[c.length-1][0]-prev[0],c[c.length-1][1]-prev[1]);
      if(dE<dS)c=c.slice().reverse();
    }
    for(let j=0;j<c.length-1;j++){
      const [la1,lo1]=c[j],[la2,lo2]=c[j+1];
      const dm=Math.hypot((la2-la1)*111000,(lo2-lo1)*88000);
      const steps=Math.max(1,Math.round(dm/4));
      for(let st=0;st<steps;st++){const f=st/steps;
        pts.push({lat:la1+(la2-la1)*f,lng:lo1+(lo2-lo1)*f,ei,d:len+dm*f})}
    }
    len+=E.len[ei];prev=c[c.length-1];
  });
  if(prev)pts.push({lat:prev[0],lng:prev[1],ei:ids[ids.length-1],d:len});
  return {pts,len};
}

const WALK_MPS=1.4;
const PLAY_SECONDS=15;

function setupWalk(ids,shortIds){
  WK.pref=densify(ids);
  WK.short=shortIds?densify(shortIds):null;
  buildGauges();
  document.getElementById('wt').classList.add('on');
  const L1=WK.pref.len, L2=WK.short?WK.short.len:L1;
  const t1=L1/WALK_MPS, t2=L2/WALK_MPS;
  const fmtT=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
  const speedup=Math.max(1,Math.round(Math.max(t1,t2)/PLAY_SECONDS));
  document.getElementById('wtMeta').innerHTML=
    `<span class="sw" style="background:#1a73c8"></span>쾌적경로 ${L1.toFixed(0)} m &middot; 도보 ${fmtT(t1)}`
    +`<br><span class="sw" style="background:#b6b6b6"></span>최단경로 ${L2.toFixed(0)} m &middot; 도보 ${fmtT(t2)}`
    +`<br><span style="color:#9a9a9a">재생 15초 &middot; 실제의 약 ${speedup}\u00d7 속도</span>`;
  document.getElementById('wtSlide').value=0;
  dot.addTo(markLayer);dotS.addTo(markLayer);
  renderWalk(0);
}

function sampleAt(route,frac){
  if(!route)return null;
  const target=frac*route.len;let i=0;
  while(i<route.pts.length-1 && route.pts[i].d<target)i++;
  return route.pts[i];
}

function buildGauges(){
  const g=document.getElementById('gauges');g.innerHTML='';
  GDEF.forEach(def=>{
    g.insertAdjacentHTML('beforeend',
      `<div class="gauge"><div class="cap">${def.cap}</div>
        <div class="gwrap">
          <div class="gfill" id="gf_${def.k}"></div>
          <div class="gline" id="gl_${def.k}"></div>
        </div>
        <div class="val">
          <span id="gv_${def.k}" style="color:var(--pref)">\u2014</span>
          <span style="color:#c8c8c8"> / </span>
          <span id="gs_${def.k}" style="color:var(--short)">\u2014</span>
        </div></div>`);
  });
}

function renderWalk(frac){
  const pp=sampleAt(WK.pref,frac), sp=sampleAt(WK.short,frac);
  if(!pp)return;
  if(!markLayer.hasLayer(dot))dot.addTo(markLayer);
  if(!markLayer.hasLayer(dotS))dotS.addTo(markLayer);
  dot.setLatLng([pp.lat,pp.lng]);
  if(sp)dotS.setLatLng([sp.lat,sp.lng]);
  dotS.bringToFront();dot.bringToFront();
  GDEF.forEach(def=>{
    const [lo,hi]=EXT[def.k],span=(hi-lo)||1;
    const rawP=E[def.k][pp.ei], rawS=sp?E[def.k][sp.ei]:null;
    const tP=rawP==null?0:(rawP-lo)/span;
    const fill=document.getElementById('gf_'+def.k);
    fill.style.height=(Math.max(0.03,tP)*100)+'%';
    fill.style.background=ramp(RAMPS[def.ramp],def.up?tP:1-tP);
    const line=document.getElementById('gl_'+def.k);
    if(rawS!=null){const tS=(rawS-lo)/span;
      line.style.display='block';line.style.bottom=(Math.max(0,Math.min(1,tS))*100)+'%';
    }else line.style.display='none';
    const f=v=>v==null?'\u2014':v.toFixed(def.dp)+(def.unit||'');
    document.getElementById('gv_'+def.k).textContent=f(rawP);
    document.getElementById('gs_'+def.k).textContent=f(rawS);
  });
  const tgt=frac*WK.pref.len;
  document.getElementById('wtProg').textContent=Math.round(tgt)+' / '+Math.round(WK.pref.len)+' m';
}

const ICON_PLAY='<svg viewBox="0 0 12 14"><path d="M1.5 1 L11 7 L1.5 13 Z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 12 14"><rect x="1.6" y="1.4" width="3.3" height="11.2" rx="1" fill="currentColor"/><rect x="7.1" y="1.4" width="3.3" height="11.2" rx="1" fill="currentColor"/></svg>';
function setPlayIcon(playing){
  const b=document.getElementById('wtPlay');
  b.innerHTML=playing?ICON_PAUSE:ICON_PLAY;
  b.className=playing?'playing':'';
  b.setAttribute('aria-label',playing?'일시정지':'재생');
}
function stopWalk(){if(walkTimer){cancelAnimationFrame(walkTimer);walkTimer=null}setPlayIcon(false)}
document.getElementById('wtSlide').oninput=e=>{stopWalk();renderWalk(e.target.value/1000)};
document.getElementById('wtPlay').onclick=()=>{
  if(walkTimer){stopWalk();return}
  const sl=document.getElementById('wtSlide');
  if(+sl.value>=1000)sl.value=0;
  setPlayIcon(true);
  const dur=PLAY_SECONDS*1000;
  let t0=null;
  const tick=ts=>{
    if(t0==null)t0=ts;
    const frac=Math.min(1,(ts-t0)/dur);
    sl.value=Math.round(frac*1000);renderWalk(frac);
    if(frac>=1){stopWalk();return}
    walkTimer=requestAnimationFrame(tick);
  };
  walkTimer=requestAnimationFrame(tick);
};

/* ---------- PET legend ---------- */
(function(){
  const rows=[
    ['선선','~18','#8096ad'],['쾌적','18–23','#a8bd8a'],
    ['약간 더움','23–29','#e0cf9a'],['더움','29–35','#d99e6a'],
    ['매우 더움','35–41','#c66b4a'],['극심한 더위','41~','#b23a32']];
  document.getElementById('petLegend').innerHTML=
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:5px">'
    +rows.map(r=>`<div style="display:flex;align-items:center;font-size:11px">
        <span style="display:inline-block;width:11px;height:11px;border-radius:2px;
          background:${r[2]};margin-right:6px"></span>
        <span style="flex:1">${r[0]}</span>
        <span style="color:#9a9a9a;font-variant-numeric:tabular-nums">${r[1]} \u00b0C</span></div>`).join('')
    +'</div>';
})();

setPlayIcon(false);
document.querySelector('#layerChips button[data-k="none"]').classList.add('on');
setMode('route');paint();
</script>
